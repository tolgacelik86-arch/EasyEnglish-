name: Build Android APK

on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Simple APK
        run: |
          mkdir -p android_app/src/main
          cat << 'EOF' > android_app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.easyenglish.app">
              <application android:label="easyenglish" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M android_app/src/main/AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar -F easyenglish-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyenglish-apk
          path: easyenglish-debug.apk
