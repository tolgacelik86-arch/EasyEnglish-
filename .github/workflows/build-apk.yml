name: Build EasyEnglish Official APK

on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Ionic & Capacitor CLI
        run: npm install -g @ionic/cli @capacitor/cli

      - name: Build Full Web App
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>easyenglish</title>
            <script src="https://cdn.tailwindcss.com"></script>
            <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
            <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
            <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
          </head>
          <body class="bg-slate-900 text-white min-h-screen">
            <div id="root"></div>
            <script type="text/babel">
              const { useState, useEffect } = React;

              const VOCAB_DATA = {
                A1: [
                  { word: 'Apple', meaning: 'Elma', example: 'I eat an apple every morning.', img: '🍎' },
                  { word: 'Book', meaning: 'Kitap', example: 'She is reading a good book.', img: '📚' },
                  { word: 'Water', meaning: 'Su', example: 'Drink plenty of water daily.', img: '💧' },
                  { word: 'House', meaning: 'Ev', example: 'Their house is near the park.', img: '🏠' },
                  { word: 'Friend', meaning: 'Arkadaş', example: 'He is my best friend.', img: '🤝' }
                ],
                A2: [{ word: 'Travel', meaning: 'Seyahat etmek', example: 'We love to travel in summer.', img: '✈️' }],
                B1: [{ word: 'Achieve', meaning: 'Başarmak', example: 'You can achieve your goals.', img: '🎯' }],
                B2: [{ word: 'Environment', meaning: 'Çevre', example: 'We must protect our environment.', img: '🌍' }],
                C1: [{ word: 'Substantial', meaning: 'Önemli / Büyük', example: 'Substantial progress was made.', img: '📊' }],
                C2: [{ word: 'Ubiquitous', meaning: 'Her yerde bulunan', example: 'Smartphones are ubiquitous.', img: '📱' }]
              };

              function EasyEnglishApp() {
                const [user, setUser] = useState(null);
                const [activeTab, setActiveTab] = useState('vocabulary');
                const [selectedLevel, setSelectedLevel] = useState('A1');
                const [searchTerm, setSearchTerm] = useState('');
                const [streak, setStreak] = useState(1);
                const [timeLeft, setTimeLeft] = useState(180);
                const [timerActive, setTimerActive] = useState(false);

                useEffect(() => {
                  let timer;
                  if (timerActive && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                  }
                  return () => clearInterval(timer);
                }, [timerActive, timeLeft]);

                const speakWord = (text) => {
                  if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'en-US';
                    window.speechSynthesis.speak(u);
                  }
                };

                if (!user) {
                  return (
                    <div class="max-w-md mx-auto min-h-screen bg-slate-900 p-6 flex flex-col justify-between text-center">
                      <div class="mt-10">
                        <div class="text-6xl mb-4 animate-bounce">🐒</div>
                        <h1 class="text-3xl font-extrabold text-indigo-400">easyenglish</h1>
                        <p class="text-xs text-slate-400 mt-2">Öğrenilen Dil: <span class="text-indigo-300 font-bold">İngilizce</span> | Ana Dil: <span class="text-indigo-300 font-bold">Türkçe</span></p>
                      </div>
                      <form onSubmit={(e) => { e.preventDefault(); setUser({ name: 'Tolga' }); }} class="space-y-4 bg-slate-800 p-6 rounded-2xl border border-slate-700">
                        <h2 class="text-lg font-bold">Kullanıcı Girişi / Kayıt</h2>
                        <input type="email" placeholder="E-posta Adresi" required class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white" />
                        <input type="password" placeholder="Şifre" required class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white" />
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3.5 rounded-xl font-bold">
                          Giriş Yap / Derslere Başla
                        </button>
                      </form>
                      <footer class="text-[10px] text-slate-500 py-4">
                        🔒 KVKK & GDPR Korumalı Veri Sistemi
                      </footer>
                    </div>
                  );
                }

                const currentList = VOCAB_DATA[selectedLevel] || [];
                const filteredList = currentList.filter(i => i.word.toLowerCase().includes(searchTerm.toLowerCase()) || i.meaning.toLowerCase().includes(searchTerm.toLowerCase()));

                return (
                  <div class="max-w-md mx-auto min-h-screen bg-slate-900 flex flex-col justify-between pb-20">
                    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
                      <div class="flex items-center space-x-2">
                        <span class="text-2xl">🐒</span>
                        <h1 class="font-bold text-indigo-400">easyenglish</h1>
                      </div>
                      <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-full text-xs font-bold">
                        🔥 Seri: {streak} Gün
                      </span>
                    </header>

                    <main class="p-4 flex-1">
                      {activeTab === 'vocabulary' && (
                        <div class="space-y-4">
                          <div class="flex space-x-2 overflow-x-auto pb-2">
                            {['A1', 'A2', 'B1', 'B2', 'C1', 'C2'].map(lvl => (
                              <button key={lvl} onClick={() => setSelectedLevel(lvl)} class={`px-4 py-2 rounded-xl text-xs font-bold ${selectedLevel === lvl ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                {lvl}
                              </button>
                            ))}
                          </div>
                          <input type="text" placeholder="Kelime ara..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white" />
                          <div class="space-y-3">
                            {filteredList.map((item, idx) => (
                              <div key={idx} class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex items-center justify-between">
                                <div>
                                  <div class="flex items-center space-x-2">
                                    <span class="text-2xl">{item.img}</span>
                                    <h3 class="font-bold text-lg text-white">{item.word}</h3>
                                  </div>
                                  <p class="text-sm text-indigo-300 mt-0.5">{item.meaning}</p>
                                  <p class="text-xs text-slate-400 italic mt-1">"{item.example}"</p>
                                </div>
                                <button onClick={() => speakWord(item.word)} class="p-3 bg-indigo-600/20 text-indigo-400 rounded-xl">🔊</button>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {activeTab === 'lesson' && (
                        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center space-y-6">
                          <div class="flex justify-between text-xs text-slate-400 border-b border-slate-700 pb-3">
                            <span>Ders Modülü</span>
                            <span class="font-mono text-amber-400 font-bold">⏳ {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}</span>
                          </div>
                          <h2 class="text-xl font-bold">3 Dakikalık Çalışma</h2>
                          {!timerActive ? (
                            <button onClick={() => setTimerActive(true)} class="w-full bg-emerald-600 py-3.5 rounded-xl font-bold">Dersi Başlat</button>
                          ) : (
                            <button disabled class="w-full bg-slate-700 text-slate-400 py-3.5 rounded-xl font-bold">Süre Devam Ediyor...</button>
                          )}
                        </div>
                      )}

                      {activeTab === 'quiz' && (
                        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center space-y-6">
                          <h2 class="text-lg font-bold text-indigo-300">Stroop Pekiştirme Sınavı</h2>
                          <div class="py-4 bg-slate-900 rounded-xl border border-slate-700">
                            <span class="text-2xl font-extrabold text-white">Apple</span>
                          </div>
                          <div class="grid grid-cols-2 gap-3">
                            {['Elma', 'Kitap', 'Su', 'Ev'].map((opt, i) => (
                              <button key={i} onClick={() => alert(opt === 'Elma' ? 'Doğru! 🎉' : 'Yanlış! ❌')} class="p-3.5 bg-slate-700 rounded-xl text-sm font-semibold text-white">
                                {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </main>

                    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-800 border-t border-slate-700 flex justify-around py-3">
                      <button onClick={() => setActiveTab('vocabulary')} class={`text-xs ${activeTab === 'vocabulary' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>📚 Kelimeler</button>
                      <button onClick={() => setActiveTab('lesson')} class={`text-xs ${activeTab === 'lesson' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>⏱️ 3 Dk Ders</button>
                      <button onClick={() => setActiveTab('quiz')} class={`text-xs ${activeTab === 'quiz' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>🎯 Stroop</button>
                    </nav>
                  </div>
                );
              }

              ReactDOM.createRoot(document.getElementById('root')).render(<EasyEnglishApp />);
            </script>
          </body>
          </html>
          EOF

      - name: Build Capacitor App
        run: |
          cat << 'EOF' > package.json
          {
            "name": "easyenglish",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0"
            }
          }
          EOF
          npm install
          npx cap init easyenglish com.easyenglish.app --web-dir www
          npx cap add android
          npx cap copy android

      - name: Build Debug APK with Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload EasyEnglish Full APK
        uses: actions/upload-artifact@v4
        with:
          name: easyenglish-full-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
