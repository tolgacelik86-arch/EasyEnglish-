name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Web App Framework
        run: |
          mkdir -p src public android/app/src/main/assets
          cat << 'EOF' > package.json
          {
            "name": "easyenglish",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": { "build": "vite build" },
            "dependencies": { "react": "^18.2.0", "react-dom": "^18.2.0", "lucide-react": "^0.263.1" },
            "devDependencies": { "@types/react": "^18.2.15", "@vitejs/plugin-react": "^4.0.3", "vite": "^4.4.5" }
          }
          EOF

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npx vite build --outDir dist

      - name: Build Android APK
        run: |
          npm install -g cordova
          cordova create hyhybrid com.easyenglish.app EasyEnglish
          cd hyhybrid
          cordova platform add android
          cp -r ../dist/* www/
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: easyenglish-apk
          path: hyhybrid/platforms/android/app/build/outputs/apk/debug/app-debug.apk
