name: Build EasyEnglish Bright UI APK

on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Build Web Application
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>easyenglish</title>
            <script src="https://cdn.tailwindcss.com"></script>
            <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
            <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
            <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
          </head>
          <body class="bg-slate-50 text-slate-800 min-h-screen select-none font-sans">
            <div id="root"></div>
            <script type="text/babel">
              const { useState, useEffect } = React;

              // Ses Altyapısı (Web Speech & Audio Fallback)
              const playTone = (freq, duration = 0.12) => {
                try {
                  const ctx = new (window.AudioContext || window.webkitAudioContext)();
                  const osc = ctx.createOscillator();
                  const gain = ctx.createGain();
                  osc.frequency.value = freq;
                  osc.connect(gain);
                  gain.connect(ctx.destination);
                  osc.start();
                  gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                  osc.stop(ctx.currentTime + duration);
                } catch (e) {}
              };

              const playCorrectSound = () => { playTone(523.25); setTimeout(() => playTone(659.25), 100); };
              const playWrongSound = () => { playTone(220, 0.25); };

              // Günlük Konuşma Kelimeleri (Sayı Eki Olmayan Temiz Veri Seti)
              const DAILY_VOCAB = [
                {
                  id: 1,
                  word: 'Hello',
                  meaning: 'Merhaba',
                  category: 'Günlük Konuşma',
                  explanation: 'İnsanlarla karşılaştığımızda kullanılan en temel selamlama sözcüğüdür.',
                  example: 'Hello! How are you today?',
                  trExample: 'Merhaba! Bugün nasılsın?',
                  img: '👋',
                  options: ['Merhaba', 'Hoşça kal', 'Teşekkürler', 'Evet']
                },
                {
                  id: 2,
                  word: 'Please',
                  meaning: 'Lütfen',
                  category: 'Günlük Konuşma',
                  explanation: 'Nezaket bildirmek ve bir şey rica etmek için kullanılır.',
                  example: 'Can you help me, please?',
                  trExample: 'Lütfen bana yardım edebilir misiniz?',
                  img: '🙏',
                  options: ['Hayır', 'Lütfen', 'Günaydın', 'Tamam']
                },
                {
                  id: 3,
                  word: 'Thank you',
                  meaning: 'Teşekkür ederim',
                  category: 'Günlük Konuşma',
                  explanation: 'Bir iyilik veya yardım karşılığında şükran belirtir.',
                  example: 'Thank you for your help.',
                  trExample: 'Yardımın için teşekkür ederim.',
                  img: '🎁',
                  options: ['Önemli değil', 'Rica ederim', 'Teşekkür ederim', 'Görüşürüz']
                },
                {
                  id: 4,
                  word: 'Goodbye',
                  meaning: 'Hoşça kal',
                  category: 'Günlük Konuşma',
                  explanation: 'Ayrılırken kullanılan vedalaşma kelimesidir.',
                  example: 'Goodbye, see you tomorrow!',
                  trExample: 'Hoşça kal, yarın görüşürüz!',
                  img: '🙋‍♂️',
                  options: ['Merhaba', 'Evet', 'Hoşça kal', 'Lütfen']
                },
                {
                  id: 5,
                  word: 'Water',
                  meaning: 'Su',
                  category: 'Günlük İhtiyaçlar',
                  explanation: 'Temel yaşam sıvısı.',
                  example: 'I need a glass of water.',
                  trExample: 'Bir bardak suya ihtiyacım var.',
                  img: '💧',
                  options: ['Kahve', 'Su', 'Çay', 'Meyve suyu']
                }
              ];

              function EasyEnglishApp() {
                const [user, setUser] = useState(null);
                const [emailInput, setEmailInput] = useState('');
                const [passwordInput, setPasswordInput] = useState('');
                const [loginError, setLoginError] = useState('');
                
                const [activeTab, setActiveTab] = useState('daily');
                const [currentCardIdx, setCurrentCardIdx] = useState(0);
                const [selectedOpt, setSelectedOpt] = useState(null);
                const [feedback, setFeedback] = useState(null);
                const [score, setScore] = useState(100);

                const speakWord = (text) => {
                  playTone(440, 0.1);
                  if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'en-US';
                    u.rate = 0.85;
                    window.speechSynthesis.speak(u);
                  }
                };

                const handleLogin = (e) => {
                  e.preventDefault();
                  // Şifre Güvenlik Kontrolü
                  if (passwordInput.length < 6) {
                    setLoginError('Hata: Şifre en az 6 karakter olmalıdır!');
                    return;
                  }
                  setLoginError('');
                  setUser({ email: emailInput });
                };

                const handleAnswer = (option, correct) => {
                  if (feedback) return;
                  setSelectedOpt(option);
                  if (option === correct) {
                    setFeedback('correct');
                    playCorrectSound();
                    setScore(prev => prev + 10);
                  } else {
                    setFeedback('wrong');
                    playWrongSound();
                  }
                };

                if (!user) {
                  return (
                    <div class="max-w-md mx-auto min-h-screen bg-emerald-500 p-6 flex flex-col justify-between text-center">
                      <div class="mt-10">
                        <div class="text-7xl mb-3 animate-bounce">🐒</div>
                        <h1 class="text-4xl font-extrabold text-white tracking-wide">easyenglish</h1>
                        <p class="text-sm text-emerald-100 font-medium mt-1">Canlı & Kolay İngilizce Öğrenimi</p>
                      </div>

                      <form onSubmit={handleLogin} class="space-y-4 bg-white p-6 rounded-3xl shadow-2xl text-left border border-emerald-100">
                        <h2 class="text-xl font-bold text-slate-800 text-center">Giriş Yap / Kaydol</h2>
                        
                        {loginError && (
                          <div class="p-3 bg-rose-100 border border-rose-300 text-rose-700 text-xs font-bold rounded-xl text-center">
                            {loginError}
                          </div>
                        )}

                        <div>
                          <label class="text-xs font-bold text-slate-500">E-posta</label>
                          <input type="email" placeholder="ornek@mail.com" required value={emailInput} onChange={(e) => setEmailInput(e.target.value)} class="w-full p-3.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                        </div>

                        <div>
                          <label class="text-xs font-bold text-slate-500">Şifre (En az 6 Karakter)</label>
                          <input type="password" placeholder="••••••••" required value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} class="w-full p-3.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                        </div>

                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-base shadow-lg shadow-emerald-600/30 transition">
                          Giriş Yap 🚀
                        </button>
                      </form>

                      <footer class="text-xs text-emerald-100 py-4 font-semibold">🔒 KVKK Korumalı Güvenli Giriş</footer>
                    </div>
                  );
                }

                const currentWord = DAILY_VOCAB[currentCardIdx % DAILY_VOCAB.length];

                return (
                  <div class="max-w-md mx-auto min-h-screen bg-slate-100 flex flex-col justify-between pb-24">
                    {/* Canlı Üst Bar */}
                    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-20 shadow-sm flex justify-between items-center">
                      <div class="flex items-center space-x-2">
                        <span class="text-3xl">🐒</span>
                        <h1 class="font-extrabold text-xl text-emerald-600">easyenglish</h1>
                      </div>
                      <span class="bg-amber-100 text-amber-700 border border-amber-300 px-3.5 py-1 rounded-full text-xs font-bold">
                        👑 {score} Puan
                      </span>
                    </header>

                    {/* Ana İçerik */}
                    <main class="p-4 flex-1">
                      {/* Günlük Kelimeler Ders Modülü */}
                      {activeTab === 'daily' && (
                        <div class="space-y-4">
                          <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-md space-y-4">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                              <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">{currentWord.category}</span>
                              <span class="text-xs text-slate-400 font-semibold">Kelime {currentCardIdx + 1} / {DAILY_VOCAB.length}</span>
                            </div>

                            {/* Görsel ve Temiz Kelime */}
                            <div class="text-center py-4 bg-emerald-50 rounded-2xl border border-emerald-100 space-y-2">
                              <span class="text-6xl">{currentWord.img}</span>
                              <h2 class="text-3xl font-black text-slate-800">{currentWord.word}</h2>
                              <p class="text-lg font-bold text-emerald-600">{currentWord.meaning}</p>
                              
                              <button onClick={() => speakWord(currentWord.word)} class="mt-2 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-emerald-700 flex items-center justify-center space-x-1 mx-auto">
                                <span>🔊 Sesli Dinle</span>
                              </button>
                            </div>

                            {/* Ders Notu & Örnek Cümle */}
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                              <p class="text-xs font-bold text-slate-500">💡 Ders Açıklaması:</p>
                              <p class="text-xs text-slate-700 font-medium">{currentWord.explanation}</p>
                              <hr class="border-slate-200 my-1" />
                              <p class="text-xs font-bold text-slate-500">📝 Örnek Cümle:</p>
                              <p class="text-xs text-emerald-700 font-bold italic">"{currentWord.example}"</p>
                              <p class="text-xs text-slate-600">"{currentWord.trExample}"</p>
                              <button onClick={() => speakWord(currentWord.example)} class="text-[11px] text-emerald-600 font-bold underline mt-1">
                                🔊 Örnek Cümleyi Seslendir
                              </button>
                            </div>
                          </div>

                          {/* Pekiştirme Sınavı */}
                          <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-md space-y-3">
                            <h3 class="text-sm font-bold text-slate-700 text-center">Pekiştirme Sınavı: Doğru Anlamı Seçin</h3>
                            <div class="grid grid-cols-2 gap-3">
                              {currentWord.options.map((opt, i) => (
                                <button key={i} onClick={() => handleAnswer(opt, currentWord.meaning)} class="p-3.5 rounded-2xl text-sm font-bold border bg-slate-50 text-slate-700 border-slate-200 hover:bg-emerald-50 hover:border-emerald-300 transition">
                                  {opt}
                                </button>
                              ))}
                            </div>

                            {/* Doğru Cevap Sonrası Görsel Açılması */}
                            {feedback && (
                              <div class={`p-4 rounded-2xl border flex flex-col items-center space-y-3 ${feedback === 'correct' ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-rose-100 border-rose-400 text-rose-900'}`}>
                                <h4 class="font-extrabold text-sm">{feedback === 'correct' ? 'Tebrikler! Doğru Cevap 🎉' : 'Yanlış Cevap ❌'}</h4>
                                
                                {feedback === 'correct' && (
                                  <div class="bg-white p-3 rounded-xl border border-emerald-200 text-center animate-bounce">
                                    <span class="text-4xl">{currentWord.img}</span>
                                    <p class="text-xs font-bold text-slate-800 mt-1">{currentWord.word} = {currentWord.meaning}</p>
                                  </div>
                                )}

                                <button onClick={() => { setCurrentCardIdx(prev => prev + 1); setSelectedOpt(null); setFeedback(null); }} class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow-md">
                                  Sonraki Kelimeye Geç ➔
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      )}
                    </main>

                    {/* Canlı Alt Menü */}
                    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-3 shadow-lg">
                      <button onClick={() => setActiveTab('daily')} class={`text-xs flex flex-col items-center ${activeTab === 'daily' ? 'text-emerald-600 font-extrabold' : 'text-slate-400'}`}>
                        <span class="text-xl">📚</span>
                        <span>Günlük Dersler</span>
                      </button>
                    </nav>
                  </div>
                );
              }

              ReactDOM.createRoot(document.getElementById('root')).render(<EasyEnglishApp />);
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Modern Android Project (Target SDK 34)
        run: |
          cat << 'EOF' > package.json
          {
            "name": "easyenglish",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF
          npm install
          npx cap init easyenglish com.easyenglish.app --web-dir www
          npx cap add android

      - name: Update Target SDK to Modern Android Standard
        run: |
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle
          npx cap copy android

      - name: Build Modern Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Bright UI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyenglish-bright-ui-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
