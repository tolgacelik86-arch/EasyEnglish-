name: Build Android AAB for Play Store

on:
  push:
    branches:
      - main  # veya 'master' şubeniz hangisiyse
  workflow_dispatch: # Telefondan GitHub butonuna basarak manuel başlatmanızı sağlar

jobs:
  build:
    name: Generate Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Assets
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || true

      - name: Build Release AAB Package
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyenglish-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
